{# English <-> Arabic toggle; returns to the same page in the other language. #}
<form action="{% url 'set_language' %}" method="post" data-no-loading>
    {% csrf_token %}
    <input name="next" type="hidden" value="{{ request.path }}">
    {% if LANGUAGE_CODE == 'ar' %}
        <input type="hidden" name="language" value="en">
        <button type="submit" class="lang-pill">{% icon "globe" "h-3.5 w-3.5" %} English</button>
    {% else %}
        <input type="hidden" name="language" value="ar">
        <button type="submit" class="lang-pill">{% icon "globe" "h-3.5 w-3.5" %} عربي</button>
    {% endif %}
</form>
