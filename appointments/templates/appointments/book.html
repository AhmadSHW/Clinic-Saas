{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Book Appointment" %}{% endblock %}
{% block nav_appointments %}bg-teal-50 text-teal-700 font-medium{% endblock %}

{% block content %}
<div class="max-w-xl">
    <h1 class="text-2xl font-bold text-slate-900 mb-6">{% trans "Book Appointment" %}</h1>

    <form method="post" class="bg-white rounded-xl border border-slate-100 p-6 space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium mb-1">{% trans "Patient" %}</label>
            <select name="patient_id" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm">
                <option value="">-- {% trans "Select Patient" %} --</option>
                {% for patient in patients %}
                    <option value="{{ patient.id }}">{{ patient.full_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">{% trans "Doctor" %}</label>
            <select name="doctor_id" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm">
                <option value="">-- {% trans "Select Doctor" %} --</option>
                {% if not doctors %}
                    <option value="" disabled>{% trans "No doctors yet. An admin can add them on the Doctors page." %}</option>
                {% endif %}
                {% for doctor in doctors %}
                    <option value="{{ doctor.id }}" {% if doctor.id|stringformat:"s" == selected_doctor %}selected{% endif %}>Dr. {{ doctor.full_name }}{% if doctor.specialty %} ({{ doctor.specialty }}){% endif %}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">{% trans "Date & Time" %}</label>
            <input type="datetime-local" name="scheduled_at" required
                   class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">{% trans "Reason" %}</label>
            <input type="text" name="reason" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm">
        </div>
        <button type="submit" class="w-full bg-teal-500 hover:bg-teal-600 text-white font-medium py-2.5 rounded-lg">
            {% trans "Book Appointment" %}
        </button>
    </form>
</div>
{% endblock %}
