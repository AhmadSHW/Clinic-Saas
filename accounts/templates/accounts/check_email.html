{% extends "public_base.html" %}
{% load i18n %}
{% block title %}{% trans "Check Your Email" %}{% endblock %}

{% block content %}
<section class="min-h-[70vh] flex items-center justify-center px-6 py-16 bg-slate-50">
    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-8 max-w-md w-full text-center">
        <div class="w-14 h-14 mx-auto rounded-full bg-teal-100 text-teal-700 flex items-center justify-center text-2xl mb-5">
            ✉️
        </div>
        <h1 class="text-xl font-bold text-slate-900 mb-2">{% trans "Check your email" %}</h1>
        <p class="text-slate-500 text-sm mb-1">{% trans "We sent a verification link to" %}</p>
        <p class="font-medium text-slate-900 mb-6">{{ email }}</p>
        <p class="text-slate-400 text-xs">
            {% trans "Didn't get it?" %}
            <a href="{% url 'accounts:resend_verification' %}" class="text-teal-600 font-medium">{% trans "Resend link" %}</a>
        </p>
    </div>
</section>
{% endblock %}
